<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Home Control</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #0b1220;
  color: white;
}

.header {
  padding: 16px;
  font-size: 20px;
  font-weight: 600;
}

.card {
  background: #111827;
  margin: 12px;
  padding: 16px;
  border-radius: 18px;
}

/* RÈM */
.window {
  height: 140px;
  background: linear-gradient(#60a5fa, #e0f2fe);
  border-radius: 12px;
  position: relative;
  overflow: hidden;
  margin-top: 10px;
}

.curtain {
  position: absolute;
  top: 0;
  width: 55%;
  height: 100%;
  background: repeating-linear-gradient(90deg,#666,#444 14px);
  transition: 0.2s;
}

.left { left: 0; }
.right { right: 0; }

/* BUTTON */
.btn {
  flex: 1;
  margin: 4px;
  padding: 12px;
  border-radius: 12px;
  border: none;
  color: white;
}

.green { background: #22c55e; }
.red { background: #ef4444; }

.controls {
  display: flex;
  margin-top: 10px;
}

/* LIGHT */
.light {
  height: 80px;
  margin-top: 10px;
  border-radius: 12px;
  background: #020617;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
}

.light.on {
  background: radial-gradient(circle,#fff7cc,#facc15);
  box-shadow: 0 0 40px rgba(255,223,0,0.8);
}

input[type=range] {
  width: 100%;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="header">📱 Smart Home Control</div>

<div class="card">
  <h3>🪟 Rèm phòng khách</h3>

  <div class="window">
    <div id="l" class="curtain left"></div>
    <div id="r" class="curtain right"></div>
  </div>

  <input type="range" min="0" max="100" value="0"
    oninput="setCurtain(this.value)">

  <div class="controls">
    <button class="btn green"
      onpointerdown="move('open')"
      onpointerup="stop()"
      onpointerleave="stop()">
      ⬆ Mở
    </button>

    <button class="btn red"
      onpointerdown="move('close')"
      onpointerup="stop()"
      onpointerleave="stop()">
      ⬇ Đóng
    </button>
  </div>
</div>

<div class="card">
  <h3>💡 Đèn phòng</h3>

  <div id="light" class="light">💡</div>

  <div class="controls">
    <button class="btn green" onclick="setLight(true)">Bật</button>
    <button class="btn red" onclick="setLight(false)">Tắt</button>
  </div>
</div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBLclO733ERnBfKLGzQXV6SYS2qohZDNwM",
  authDomain: "smart-home-9c715.firebaseapp.com",
  databaseURL: "https://smart-home-9c715-default-rtdb.firebaseio.com",
  projectId: "smart-home-9c715",
  storageBucket: "smart-home-9c715.appspot.com",
  messagingSenderId: "861060916867",
  appId: "1:861060916867:web:baf38aa90cdf362a4d1db6"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* STATE */
let pos = 0;
let lightOn = false;
let interval = null;

/* ===== RÈM ===== */
function setCurtain(v){
  pos = +v;
  render();
  sync();
}

function move(dir){
  clearInterval(interval);

  interval = setInterval(()=>{
    if(dir==="open" && pos<100) pos+=1;
    if(dir==="close" && pos>0) pos-=1;

    render();
    sync();
  },20);
}

function stop(){
  clearInterval(interval);
}

/* render rèm */
function render(){
  let p = pos/100;

  document.getElementById("l").style.transform =
    `translateX(-${p*90}%)`;

  document.getElementById("r").style.transform =
    `translateX(${p*90}%)`;

  document.getElementById("light")
    .classList.toggle("on", lightOn);
}

/* ===== ĐÈN ===== */
function setLight(state){
  lightOn = state;
  sync();
  render();
}

/* ===== FIREBASE SYNC ===== */
function sync(){
  set(ref(db,"home"),{
    curtain: pos,
    light: lightOn
  });
}

</script>

</body>
</html>
