<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control</title>
<style>
body{margin:0;font-family:sans-serif;background:#0b1220;color:white}
.card{background:#111827;margin:15px;padding:18px;border-radius:18px}
.window{height:140px;background:#60a5fa;border-radius:12px;position:relative;overflow:hidden}
.curtain{position:absolute;top:0;width:55%;height:100%;background:#444}
.left{left:0}.right{right:0}
.controls{display:flex;margin-top:10px}
.btn{flex:1;margin:5px;padding:14px;border:none;border-radius:12px;color:white}
.open{background:#22c55e}.close{background:#ef4444}
.light{height:80px;margin-top:10px;border-radius:12px;background:#020617;display:flex;align-items:center;justify-content:center}
.light.on{background:#facc15;color:black}
</style>
</head>

<body>

<div class="card">
<h3>🪟 Rèm</h3>

<div class="window">
<div id="l" class="curtain left"></div>
<div id="r" class="curtain right"></div>
</div>

<input type="range" min="0" max="100" value="0" oninput="setCurtain(this.value)">

<div class="controls">
<button class="btn open" onpointerdown="move('open')" onpointerup="stop()">Mở</button>
<button class="btn close" onpointerdown="move('close')" onpointerup="stop()">Đóng</button>
</div>
</div>

<div class="card">
<h3>💡 Đèn</h3>
<div id="light" class="light">💡</div>

<div class="controls">
<button class="btn open" onclick="setLight(true)">Bật</button>
<button class="btn close" onclick="setLight(false)">Tắt</button>
</div>
</div>

<script>

let pos = 0;
let interval = null;

/* ghi dữ liệu */
function sync(){
  localStorage.setItem("curtain", pos);
}

/* RÈM */
function setCurtain(v){
  pos = +v;
  render();
  sync();
}

function move(dir){
  clearInterval(interval);
  interval = setInterval(()=>{
    if(dir==="open" && pos<100) pos+=1;
    if(dir==="close" && pos>0) pos-=1;
    render();
    sync();
  },20);
}

function stop(){
  clearInterval(interval);
}

function render(){
  let p = pos/100;
  document.getElementById("l").style.transform=`translateX(-${p*90}%)`;
  document.getElementById("r").style.transform=`translateX(${p*90}%)`;
}

/* ĐÈN */
function setLight(state){
  localStorage.setItem("light", state?"1":"0");
}

/* auto sync light theo rèm (logic ở display cũng có) */

setInterval(()=>{
  // giữ sync liên tục
  sync();
},100);

</script>

</body>
</html>
