<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Display</title>

<style>
body{margin:0;font-family:sans-serif;background:#000;color:white;text-align:center}
.window{height:250px;margin:20px;background:#60a5fa;position:relative;overflow:hidden}
.curtain{position:absolute;top:0;width:55%;height:100%;background:#444}
.left{left:0}.right{right:0}
.light{height:120px;margin:20px;background:#020617;display:flex;align-items:center;justify-content:center;font-size:50px}
.light.on{background:#facc15;color:black}
</style>
</head>

<body>

<h1>🏠 Smart Home Display</h1>

<div class="window">
<div id="l" class="curtain left"></div>
<div id="r" class="curtain right"></div>
</div>

<div id="light" class="light">💡</div>

<script>

let lastPos = 0;

/* đọc dữ liệu realtime */
setInterval(()=>{

  let pos = +localStorage.getItem("curtain") || 0;
  let light = localStorage.getItem("light") === "1";

  /* rèm */
  let p = pos/100;

  document.getElementById("l").style.transform=`translateX(-${p*90}%)`;
  document.getElementById("r").style.transform=`translateX(${p*90}%)`;

  /* logic auto light */
  if(pos <= 10 && !light){
    document.getElementById("light").classList.add("on");
  }else if(light){
    document.getElementById("light").classList.add("on");
  }else{
    document.getElementById("light").classList.remove("on");
  }

},50);

</script>

</body>
</html>
